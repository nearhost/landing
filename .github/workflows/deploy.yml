name: Deploy

# Pages serves the gh-pages branch. Pushes to main publish the site at its root; each pull
# request gets a preview under pr-preview/pr-<number>/, removed again when the pull request
# closes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # The whole history, so each docs page and sitemap entry is dated by its own last commit
      # rather than by the one commit a shallow clone has.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: shellcheck public/install.sh scripts/test-install.sh
      - run: npm run verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
          fail: true

      # A preview is built again under its own base path. The deploy actions never delete CNAME
      # or .nojekyll, so in a preview they would outlive its removal; only the root gets them.
      - if: github.event_name == 'pull_request'
        run: |
          npm run build
          rm dist/CNAME
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE: /pr-preview/pr-${{ github.event.number }}/
      - if: github.event_name != 'pull_request'
        run: touch dist/.nojekyll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 1

  # The PowerShell installer, under Windows PowerShell 5.1 and PowerShell 7. It gates the deploy as
  # the build does.
  install-windows:
    if: github.event.action != 'closed'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test under Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
      # Each check runs even when one before it failed, so one run shows every failure.
      - name: Test under PowerShell 7
        if: success() || failure()
        shell: pwsh
        run: npm run test:install:ps
      - name: PSScriptAnalyzer
        if: success() || failure()
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          $found = 'public/install.ps1', 'scripts/test-install.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Error, Warning }
          $found | Format-Table -AutoSize -Wrap | Out-String -Width 200
          if ($found) { exit 1 }

  lighthouse:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    needs: [build, install-windows]
    # Runs after a green build and installer check, or alone when a pull request closes to remove
    # its preview. A fork's token cannot push to gh-pages, so fork pull requests get no preview.
    if: >-
      always() &&
      ((needs.build.result == 'success' && needs.install-windows.result == 'success') || github.event.action == 'closed') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Every deploy pushes to gh-pages, so deploys queue rather than race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site

      - if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          # Previews and the daily stats snapshot (stats.yml) live beside the site, not in it.
          clean-exclude: |
            pr-preview/
            stats/

      - if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: nearhost.dev
          qr-code: false
