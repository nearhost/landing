name: Deploy

# Pages serves the gh-pages branch. Pushes to main publish the site at its root; each pull
# request gets a preview under pr-preview/pr-<number>/, removed again when the pull request
# closes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # The whole history, so each docs page and sitemap entry is dated by its own last commit
      # rather than by the one commit a shallow clone has.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: shellcheck public/install.sh scripts/test-install.sh
      - run: npm run verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
          fail: true

      # A preview is built again under its own base path. The deploy actions never delete CNAME
      # or .nojekyll, so in a preview they would outlive its removal; only the root gets them.
      - if: github.event_name == 'pull_request'
        run: |
          npm run build
          rm dist/CNAME
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE: /pr-preview/pr-${{ github.event.number }}/
      - if: github.event_name != 'pull_request'
        run: touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 1

  lighthouse:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    needs: build
    # Runs after a green build, or alone when a pull request closes to remove its preview. A
    # fork's token cannot push to gh-pages, so fork pull requests get no preview.
    if: >-
      always() &&
      (needs.build.result == 'success' || github.event.action == 'closed') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Every deploy pushes to gh-pages, so deploys queue rather than race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          # Previews and the daily stats snapshot (stats.yml) live beside the site, not in it.
          clean-exclude: |
            pr-preview/
            stats/

      - if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: nearhost.dev
          qr-code: false
